window:
  process_name: ShopTitan.exe
  # The process match is authoritative. The title is an optional fallback/hint.
  title_contains: Shop Titans
  # Direct HWND capture is not affected by windows overlapping the game.
  capture_method: window
  min_client_width: 640
  min_client_height: 480

hiring:
  category: warrior
  class: soldier

  # Both random skills must be present in this allow-list.
  allowed_skills:
    - extra_plating
    - impervious
    - juggernaut
    - thick_skin

  limits:
    max_gold_spent: 1000000
    max_attempts: 100
